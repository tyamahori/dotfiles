name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # scripts/audit-python-usage.test.ts runs the script through uv, as everything Python here does.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The lint hooks under test skip silently when their linter is missing, so
      # install the ones the runner image lacks (shellcheck, yq, docker are preinstalled).
      - name: Install linters
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSLo "$bin/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $bin/hadolint" | sha256sum -c -
          chmod +x "$bin/hadolint"
          curl -fsSLo "$RUNNER_TEMP/sqruff.tgz" https://github.com/quarylabs/sqruff/releases/download/v0.41.0/sqruff-linux-x86_64-musl.tar.gz
          echo "bec91903368ec57668c70c87cf9e382b227b3978001339ae8597d0a93328672e  $RUNNER_TEMP/sqruff.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/sqruff.tgz" -C "$bin"
          echo "$bin" >>"$GITHUB_PATH"
          # Same version devbox.lock resolves locally; pipx puts it in ~/.local/bin.
          pipx install semgrep==1.179.0
          bun install --frozen-lockfile --cwd tools/dclint

      # Smoke-tests placement on a fresh Linux home; it also creates the
      # ~/dotfiles alias that the hooks under test resolve their helpers from.
      - name: scripts/link
        run: |
          scripts/link >/dev/null
          test "$(readlink -f "$HOME/dotfiles")" = "$GITHUB_WORKSPACE"
          for link in .claude/settings.json .codex/hooks.json .copilot/hooks/dotfiles.json .omp/agent/config.yml .config/git/ignore; do
            test -e "$HOME/$link" || { echo "missing $HOME/$link" >&2; exit 1; }
          done

      - name: shellcheck
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            [[ $(head -n 1 "$file") =~ ^\#!.*[/\ ](ba)?sh(\ |$) ]] && printf '%s\0' "$file"
          done | xargs -0 shellcheck

      - name: bun test
        run: bun test ./scripts/*.test.ts ./omp/tests/*.test.ts

      - name: omp-herdr-collab review-flow tests
        run: agents/skills/omp-herdr-collab/tests/test_review_flow.py
