# Codex CLI defaults, loaded as the system layer (/etc/codex/config.toml).
#
# Why the system layer and not ~/.codex/config.toml: Codex itself writes to the
# user file (project trust list, hooks.state hashes, plugin/marketplace state,
# desktop-app MCP servers, /model choices), so tracking that file would churn
# on every session and leak project paths into this public repository. The
# system layer is read-only from Codex's point of view and the user layer
# overrides it, so /model and other in-session changes still win.
#
# Machine-local state stays in ~/.codex/config.toml. Rules live in
# ~/.codex/rules/. scripts/link checks the /etc symlink and prints the sudo
# command when it is missing.

model = "gpt-6.1-terra"
# Matches the user-layer choice (~/.codex/config.toml) so the canonical pin and
# the effective value agree. Raised from Terra's official starting effort
# (medium) to xhigh on 2026-11-06 at the user's request.
model_reasoning_effort = "xhigh"
service_tier = "default"
# Compact between turns once the context reaches ~160k tokens (35% of Terra's
# usable window), the same point as omp/config.yml compaction.thresholdTokens.
# Not model_auto_compact_token_limit: that one also fires mid-turn, and a
# single-turn `codex exec` review would lose the files it already read.
model_post_turn_compact_threshold_percent = 35

# Keep workspace isolation while routing approval requests to auto-review.
# Commands resolved as allow (rules/default.rules: docker, make, ...) run
# outside the sandbox and bypass review.
#
# A permission profile instead of sandbox_mode/[sandbox_workspace_write]: only
# profiles can deny paths inside the workspace, and the two styles can't mix,
# so no layer (including ~/.codex/config.toml, which adds machine-local write
# roots to this same profile name) may set sandbox_mode. deny blocks read and
# write, so sandboxed commands never see .env secrets.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "dev"

[permissions.dev]
extends = ":workspace"

[permissions.dev.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.local" = "deny"

[permissions.dev.network]
enabled = true

[features]
hooks = true
memories = true
multi_agent_v2 = true
recommended_plugins = true

[tui]
# PermissionRequest hooks already deliver approval banners via codex-notify.
notifications = false

# Same arguments as omp/mcp.json (the source; scripts/playwright-setup derives
# the Claude registration from it). Keep this copy in step.
[mcp_servers.playwright]
command = "playwright-mcp"
args = ["--browser", "chrome", "--headless", "--isolated", "--output-dir", ".agent-msgs/screenshots/playwright-mcp"]

# 1Password Environments MCP (needs Settings > Developer > "Integrate with MCP
# clients" in the desktop app). Claude registers the same command at user scope.
[mcp_servers.1password]
command = "1password-mcp"

# Not here: `[[skills.config]]` (per-skill enable/disable). Codex ignores that
# array in the system layer (verified 0.153.2: it only takes effect in
# ~/.codex/config.toml), so scripts/link appends the one entry we need there.
