name: sonarqube

services:
  server:
    # Local-only analysis server; freshness over pinning (docker compose pull).
    image: sonarqube:latest # dclint disable-line service-image-require-explicit-tag
    volumes:
      - type: volume
        source: data
        target: /opt/sonarqube/data
      - type: volume
        source: extensions
        target: /opt/sonarqube/extensions
      - type: volume
        source: logs
        target: /opt/sonarqube/logs
    restart: unless-stopped
    labels:
      dev.orbstack.domains: sonarqube.local
      dev.orbstack.http-port: "9000"
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192

volumes:
  data:
  extensions:
  logs:
