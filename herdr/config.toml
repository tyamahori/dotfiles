onboarding = false

# 新しい tab/pane を作成元 pane と同じディレクトリで開く。
# new_cwd は workspace を含む共通ポリシーのため、新しい workspace も同様に引き継ぐ。
[terminal]
new_cwd = "follow"

# 標準アクションは terminal.new_cwd の follow を使うため、HOME 専用コマンドへ置き換える。
[keys]
new_workspace = ""

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = '"${HERDR_BIN_PATH}" workspace create --cwd "$HOME" --focus'
description = "新しい HOME workspace を開く"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

# デフォルトレイアウト + $subagents（実行中サブエージェント数）。
# 報告元: omp/extensions/herdr-subagents.ts と claude/hooks/herdr-subagents.sh。
# 未報告のトークンは行から消えるだけなので、他エージェントには影響しない。
[ui.sidebar.agents]
rows = [
    ["state_icon", "workspace", "tab"],
    ["agent", "$subagents"],
]

# Claude Code (claude/hooks/herdr-notify.sh)・Codex (scripts/codex-notify)・
# OMP (omp/extensions/notify.ts) が terminal-notifier で独自フォーマットの
# macOS 通知を出すため、標準通知は無効。
# 注意: copilot ペインはフック未対応なので現状は通知なし。
[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

# reviewr サイドバーのトグル。auto-open は worktree.created 限定なので、
# worktree を使わない workspace ではこのキーで開閉する。
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[experimental]
# herdr-browser（Chromiumをペインに描画）が要求。Kitty graphics対応ターミナル前提。
kitty_graphics = true
pane_history = true
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "copilot"]
