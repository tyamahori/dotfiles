onboarding = false

# 新しい tab/pane を作成元 pane と同じディレクトリで開く。
# new_cwd は workspace を含む共通ポリシーのため、新しい workspace も同様に引き継ぐ。
[terminal]
new_cwd = "follow"
# terminal-browser（Chromiumをペインに描画）が要求。Kitty graphics対応ターミナル前提。
# 0.9.5 で experimental.kitty_graphics から移動（既定 true だが依存を明示しておく）。
kitty_graphics = true

# 標準アクションは terminal.new_cwd の follow を使うため、HOME 専用コマンドへ置き換える。
[keys]
new_workspace = ""
# 0.9.2 で追加。プロンプト行を残して画面と scrollback を消す（既定は未割り当て）。
clear_pane = "prefix+shift+c"
# エージェント間の移動は既定で未割り当て。agent_panel_sort = "priority" の並び順で回る。
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"
last_pane = "prefix+semicolon"

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = '"${HERDR_BIN_PATH}" workspace create --cwd "$HOME" --focus'
description = "新しい HOME workspace を開く"

# レイアウトを崩さずに一時的なシェルを開く。exit で閉じる。
[[keys.command]]
key = "prefix+t"
type = "popup"
command = 'exec "${SHELL:-sh}"'
width = "80%"
height = "80%"
description = "スクラッチ端末を popup で開く"

[ui]
# 0.9.4 で workspace の最後の pane を閉じる前に確認が入るようになった。不要なので切る。
confirm_close = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
# blocked / working / done を色だけでなく形でも区別する。
status_indicators = "symbols"
tab_bar_right = [{ type = "zoom" }]

# 1 行目はデフォルトレイアウト。2 行目にエージェント名、3 行目に状態テキストを出す。
# machine は saved machine があるときだけ表示される。
[ui.sidebar.agents]
rows = [
    ["state_icon", "machine", "workspace", "tab"],
    ["agent"], ["state_text"],
]

# OMP は terminal title にセッション題名を出すので、2 行目に表示する。
# Claude の title は "✳ Claude Code" 固定に近く情報がないため対象外。
[ui.sidebar.agents.rows_by_agent]
omp = [
    ["state_icon", "machine", "workspace", "tab"],
    ["terminal_title_stripped"],
    ["state_text"],
]

# Claude Code (claude/hooks/herdr-notify.sh)・Codex (scripts/codex-notify)・
# OMP (omp/extensions/notify.ts) が terminal-notifier で独自フォーマットの
# macOS 通知を出すため、標準通知は無効。
# 注意: copilot ペインはフック未対応なので現状は通知なし。
[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

# Hunk pane (レビュー面は Hunk に一本化。旧 reviewr plugin は撤去済み)。
# type = "pane" は一時 pane を開き、hunk を q で抜けると pane も閉じる。
# cwd は terminal.new_cwd = "follow" で作成元 pane と同じ worktree になる。
[[keys.command]]
key = "cmd+r"
type = "pane"
command = "hunk diff --watch"
description = "Hunk で working tree の差分を開く"

# scripts/tool-release-review の最新レポートを Claude で開く（承認した項目だけ適用）。
[[keys.command]]
key = "prefix+shift+u"
type = "pane"
command = '"$HOME/dotfiles/scripts/tool-release-review" --apply'
description = "ツール更新レビューを開く"

[experimental]
# 画面履歴を平文の session-history.json に残さない（agent が出したトークン等も残るため）。既定も false。
pane_history = false
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "copilot"]

[theme]
name = "dracula"
auto_switch = false
