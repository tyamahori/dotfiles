id = "tyamahori.worktree-track"
name = "worktree-track"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "After herdr creates a worktree, track and follow the same-named remote branch when it exists."

# herdr worktree create branches from local HEAD and never consults the remote;
# this hook makes a worktree for an existing remote branch actually follow it.
[[events]]
on = "worktree.created"
command = ["bash", "track.sh"]
