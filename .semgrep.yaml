rules:
  # scripts/link 76ec771: under `set -o pipefail`, `cmd | grep -q pat` dies
  # with SIGPIPE (141) when grep exits at the first match before cmd finishes
  # writing, so guard branches misfire. Capture first, then grep the variable.
  # printf/echo producers are the prescribed fix shape and stay allowed.
  # Only files that actually declare pipefail are checked: pattern-either
  # requires a preceding "set -o pipefail" or "set -euo pipefail" (the two
  # forms used in this repo), so comment-only mentions of the bare word and
  # explicit "set +o pipefail" disables stay exempt. Known ceiling: a comment
  # quoting a full declaration form still matches; use nosemgrep there.
  - id: pipe-into-grep-q-under-pipefail
    languages: [generic]
    severity: ERROR
    message: >-
      "cmd | grep -q" under pipefail fails with SIGPIPE when grep exits early.
      Capture first: out="$(cmd || true)"; then grep -q pattern <<<"$out".
    options:
      generic_ellipsis_max_span: 5000
    patterns:
      - pattern: "| grep -q"
      - pattern-either:
          - pattern-inside: set -o pipefail ... | grep -q
          - pattern-inside: set -euo pipefail ... | grep -q
      - pattern-not-inside: printf ... | grep -q
      - pattern-not-inside: echo ... | grep -q
    paths:
      include:
        - scripts
        - git

  # docs/ops 2026-08-28: a plannotator installer wrote an absolute
  # /Users/... path into repo-managed codex/hooks.json through the home
  # symlink. Hardcoded macOS home paths also break the Linux cloud-init
  # machine (different username, /home). docs/ is excluded because session
  # logs legitimately quote such paths when recording these incidents.
  - id: no-hardcoded-users-path
    languages: [generic]
    severity: ERROR
    message: >-
      Hardcoded macOS home path. Use $HOME or ~ in scripts and @HOME@ /
      @REPO_ROOT@ in launchd templates; absolute user paths break the Linux
      cloud-init machine and pin machine-specific state into the repo.
    pattern: /Users/
    paths:
      exclude:
        - docs

  # CLAUDE.md "measured 2026-08-18": a usage journal with agent session IDs
  # landed in public history before being untracked. Session IDs are UUIDs;
  # no legitimate committed file in this repo contains one, so any match is
  # leaked machine-local state.
  - id: no-session-uuid
    languages: [generic]
    severity: ERROR
    message: >-
      UUID literal — likely an agent session ID or other machine-local
      identifier. Keep session IDs in local-only (gitignored) files.
    patterns:
      - pattern-regex: \b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b
