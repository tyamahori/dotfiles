providers: 
  tinyModel: lfm2-350m
  autoThinkingMaxEffort: xhigh
  webSearchOrder: 
    - google
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - mojeek
    - public
modelRoles: 
  vision: openai-codex/gpt-5.6-terra
  smol: openai-codex/gpt-5.6-luna
  task: openai-codex/gpt-5.6-terra
  commit: openai-codex/gpt-5.6-luna
  plan: openai-codex/gpt-5.6-terra
  slow: openai-codex/gpt-5.6-sol
  advisor: openai-codex/gpt-5.6-terra
  default: anthropic/claude-fable-5:high
task: 
  showResolvedModelBadge: true
  maxRecursionDepth: 1
  softRequestBudget: 60
  agentModelOverrides: 
    scout: "@smol"
    reviewer: "@task"
    security-reviewer: "@task"
    librarian: "@smol"
compaction: 
  thresholdTokens: 160000
display: 
  showTokenUsage: true
  cacheMissMarker: true
memory: 
  backend: local
autolearn: 
  enabled: true
  autoContinue: false
  minToolCalls: 5
skills: 
  ignoredSkills: 
    - agents-sdk
    - cloudflare
    - cloudflare-email-service
    - cloudflare-one
    - cloudflare-one-migrations
    - durable-objects
    - sandbox-sdk
    - turnstile-spin
    - workers-best-practices
    - wrangler
    - web-perf
    - php-code-review
    - php-project-guide
    - upgrade-php
    - freee-api-skill
retry: 
  fallbackChains: 
    anthropic/*: 
      - openai-codex/gpt-5.6-sol
      - openai-codex/gpt-5.4
  usageAwareFallback: true
  usageReservePct: 20
  usageReservePolicy: auto
  modelFallback: true
  maxRetries: 4
  maxDelayMs: 60000
symbolPreset: unicode
defaultThinkingLevel: auto
magicKeywords: 
  enabled: false
colorBlindMode: true
setupVersion: 2
dev: 
  autoqaConsent: granted
composer: 
  shape: pi