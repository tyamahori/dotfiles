modelRoles:
  vision: anthropic/claude-sonnet-5-5
  smol: anthropic/claude-haiku-5-5
  task: anthropic/claude-sonnet-5-5
  commit: anthropic/claude-haiku-5-5
  plan: anthropic/claude-fable-5-2
  slow: openai-codex/gpt-6-astra
  advisor: openai-codex/gpt-6.1-terra
  default: anthropic/claude-opus-5-5
  web: web/google
  tiny: local/lfm2.5-350m
  widget: anthropic/claude-haiku-5-5
retry:
  fallbackChains:
    openai-codex/gpt-6-astra:
      - openai-codex/gpt-6.1-sol
    anthropic/*:
      - openai-codex/gpt-6-astra
      - openai-codex/gpt-6.1-sol
    openai-codex/*:
      - anthropic/claude-sonnet-5-5
      - anthropic/claude-haiku-5-5
    web:
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-5-5
      - openai-codex/gpt-6-luna
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-6.1-sol
      - xai-oauth/grok-4.5
      - web/ollama
  usageAwareFallback: true
  usageReservePct: 20
  usageReservePolicy: auto
  modelFallback: true
  maxRetries: 4
  rateLimitWalksChain: true
  maxDelayMs: 60000
task:
  showResolvedModelBadge: true
  maxRecursionDepth: 1
  softRequestBudget: 200
  # Per-spawn effort (lo/med/hi) lets cheap fan-out run at low thinking;
  # maxEffort caps "hi" at the main thread's defaultThinkingLevel.
  enableEffort: true
  maxEffort: high
  agentModelOverrides:
    scout: "@smol"
    reviewer: "@slow"
    security-reviewer: "@slow"
  enableLsp: true
compaction:
  thresholdTokens: 160000
  methodOrder:
    - remote
    - handoff
    - shake
    - soft
lsp:
  diagnosticsOnEdit: true
prewalk:
  auto: suggest
  from: "@plan"
  into: "@task"
tools:
  xdevDocs: builtins
  xdevNotices: false
  # The idea MCP terminal runs arbitrary shell outside bash.patterns and the
  # deny-commands extension, so it always asks (headless subagents: refused).
  approval:
    mcp__idea_execute_terminal_command: prompt
  restrictedFolders:
    - ~/.ssh
    - ~/.aws
    - ~/.config/gh
    - ~/.gnupg
# Destructive remote/history operations ask even under the default yolo mode;
# headless subagents cannot answer, so they are refused there.
bash:
  patterns:
    - match: "git *push *--force*"
      approval: prompt
    - match: "git *push -f*"
      approval: prompt
    - match: "git *push * -f*"
      approval: prompt
    - match: "git *push * +*"
      approval: prompt
    - match: "git *reset *--hard*"
      approval: prompt
    - match: "git *clean *-*f*"
      approval: prompt
    - match: "gh repo delete*"
      approval: prompt
    - match: "gh api *-X DELETE*"
      approval: prompt
    - match: "gh api *-XDELETE*"
      approval: prompt
    - match: "gh api *--method DELETE*"
      approval: prompt
    - match: "docker volume rm*"
      approval: prompt
    - match: "docker volume prune*"
      approval: prompt
    - match: "docker system prune*"
      approval: prompt
advisor:
  enabled: true
  # Final-yield review only. Per-turn review (measured 2026-10-24: 7 days,
  # 6314 advisor calls, 857 injections) delivered 88% of findings 5+ turns
  # late (median 24), too late to correct drift mid-task.
  reviewMode: agent-end
checkpoint:
  enabled: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  collapseCompacted: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: false
skills:
  ignoredSkills:
    - php-code-review
    - php-project-guide
    - upgrade-php
    - freee-api-skill
    - mcp-builder
    - codex/terminal-browser
    - claude/plannotator
    - agents/plannotator
enabledProviders:
  - claude
  - codex
contextFiles:
  extra:
    - AGENTS.local.md
defaultThinkingLevel: high
# omp 18.17.0 lowered the default to low (Codex included); keep reviewer and
# advisor reports at their previous length.
textVerbosity: medium
magicKeywords:
  enabled: true
colorBlindMode: true
setupVersion: 3
dev:
  autoqaConsent: granted
composer:
  shape: pi
tui:
  completeScrollback: true
browser:
  screenshotDir: .agent-msgs/screenshots
security:
  enabled: true
features:
  unexpectedStopDetection: smart
claudeResets:
  autoRedeem5h: "yes"
  autoRedeemWeekly: "yes"
  autoRedeemFable: "yes"
codexResets:
  autoRedeem5h: "yes"
  autoRedeemWeekly: "yes"
update:
  auto: true