  slow: openai-codex/gpt-6-astra
  advisor: openai-codex/gpt-5.6-terra
  default: anthropic/claude-opus-5-5
  web: web/google
  tiny: local/lfm2.5-350m
retry:
  fallbackChains:
    openai-codex/gpt-6-astra:
      - anthropic/claude-fable-5-1
    anthropic/*:
      - openai-codex/gpt-6-astra
      - openai-codex/gpt-5.6-sol
    openai-codex/*:
      - anthropic/claude-sonnet-5
      - anthropic/claude-haiku-4-5
    web:
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/mojeek
      - web/public
      - web/perplexity
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
  usageAwareFallback: true
  usageReservePct: 20
  usageReservePolicy: auto
  modelFallback: true
  maxRetries: 4
  maxDelayMs: 60000
task:
  showResolvedModelBadge: true
  maxRecursionDepth: 1
  softRequestBudget: 60
  agentModelOverrides:
    scout: "@smol"
    reviewer: "@slow"
    security-reviewer: "@slow"
    librarian: "@smol"
compaction:
  thresholdTokens: 160000
display:
  showTokenUsage: true
  cacheMissMarker: true
  collapseCompacted: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: false
  minToolCalls: 5
skills:
  ignoredSkills:
    - php-code-review
    - php-project-guide
    - upgrade-php
    - freee-api-skill
    - mcp-builder
enabledProviders:
  - claude
  - codex
symbolPreset: unicode
defaultThinkingLevel: medium
magicKeywords:
  enabled: false
colorBlindMode: true
setupVersion: 2
dev:
  autoqaConsent: granted
composer:
  shape: pi
hideThinkingBlock: false
browser:
  screenshotDir: .agent-msgs/screenshots