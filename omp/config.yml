providers: 
  webSearchOrder: 
    - google
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - mojeek
    - public
modelRoles: 
  default: anthropic/claude-fable-5
  vision: openai-codex/gpt-5.6-terra
  smol: openai-codex/gpt-5.6-luna
  task: openai-codex/gpt-5.6-terra
  # コミットメッセージ/変更履歴生成（mapReduce は 1 ファイル最大 50K トークン）を
  # default（Fable）から外して Codex 枠へ（2026-08-15 トークン節約）
  commit: openai-codex/gpt-5.6-luna
  # plan/slow は未設定だと default（Fable）にフォールバックするため
  # 明示的に Codex へ（2026-08-15 トークン節約）
  plan: openai-codex/gpt-5.6-terra
  slow: openai-codex/gpt-5.6-sol
# サブエージェントを Fable に落とさないための明示ルーティング（2026-08-15）。
# 経緯: modelRoles 未整備時代に scout が親モデル継承で Fable 実行（68 req / $26）。
# bundled scout/librarian は frontmatter が @smol を解決するが、role 構成の
# ドリフトで再発しないよう明示。reviewer 系は frontmatter 無し=親モデル継承
# のため Codex へ。precedence: agentModelOverrides > frontmatter > 親モデル。
# 注意: 稼働中セッションには効かない（設定は起動時スナップショット）。
task:
  agentModelOverrides:
    scout: "@smol"              # → gpt-5.6-luna（read-only 偵察は smol 階で十分）
    reviewer: "@task"           # → gpt-5.6-terra
    security-reviewer: "@task"
    librarian: "@smol"
prewalk: 
  enabled: false
# Fable は 1M 窓のため既定閾値（窓-15%≈850K）では自動コンパクションが事実上
# 無効になり、セッションが 200K 超（実測: fable リクエストの 11%、最大 280K）
# まで肥大していた。Anthropic の長コンテキスト課金帯（>200K で単価増）を
# 避けつつ 1 リクエストあたりの quota 消費を抑えるため固定閾値で切る。
# strategy は既定の snapcompact（アーカイブ型・keepRecent 20K）のまま。
compaction:
  thresholdTokens: 120000  # 160K から追加圧縮（2026-08-15、Fable 週次枠 82% 消費時点）
# omp セッションで一度も読まれていないドメイン外スキルを除外して
# 毎リクエストのプロンプトから落とす（Claude Code 側には影響しない）。
# 必要になったら該当行を消すだけで戻る。
skills:
  ignoredSkills:
    - agents-sdk
    - cloudflare
    - cloudflare-email-service
    - cloudflare-one
    - cloudflare-one-migrations
    - durable-objects
    - sandbox-sdk
    - turnstile-spin
    - workers-best-practices
    - wrangler
    - web-perf
    - php-code-review
    - php-project-guide
    - upgrade-php
    - freee-api-skill
retry: 
  fallbackChains: 
    anthropic/*: 
      - openai-codex/gpt-5.6-sol
      - openai-codex/gpt-5.4
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: auto
  # usage-aware fallback（quota 残 10% で sol へ退避）は modelFallback と
  # usageAwareFallback の両方が true でないと動かない。false だと quota
  # 枯渇時に停止する（2026-08-15）。fallback 先は上の chains のみ。
  modelFallback: true
  maxRetries: 4
  maxDelayMs: 60000
symbolPreset: unicode
colorBlindMode: true
setupVersion: 1
dev: 
  autoqaConsent: granted