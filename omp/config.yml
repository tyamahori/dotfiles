providers: 
  tinyModel: lfm2-350m
  autoThinkingMaxEffort: high
  webSearchOrder: 
    - google
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - mojeek
    - public
modelRoles: 
  vision: openai-codex/gpt-5.6-terra
  smol: openai-codex/gpt-5.6-luna
  task: openai-codex/gpt-5.6-terra
  commit: openai-codex/gpt-5.6-luna
  plan: openai-codex/gpt-6-astra
  slow: openai-codex/gpt-6-astra
  advisor: openai-codex/gpt-5.6-terra
  default: anthropic/claude-fable-5-1:high
task: 
  showResolvedModelBadge: true
  maxRecursionDepth: 1
  softRequestBudget: 60
  agentModelOverrides: 
    scout: "@smol"
    reviewer: "@slow"
    security-reviewer: "@slow"
    librarian: "@smol"
compaction: 
  thresholdTokens: 160000
display: 
  showTokenUsage: true
  cacheMissMarker: true
  collapseCompacted: false
memory: 
  backend: local
autolearn: 
  enabled: true
  autoContinue: false
  minToolCalls: 5
skills: 
  ignoredSkills: 
    - php-code-review
    - php-project-guide
    - upgrade-php
    - freee-api-skill
    - mcp-builder
    # Contradicts global-instructions (Orca is not a coordination surface on
    # this machine); ignoredSkills also blocks explicit /skill: use, so only
    # this one is dropped — user-invoked plugin skills stay loadable.
    - orchestration
# omp 18.1.5+ gates user-level foreign sources behind enabledProviders. PR #10666
# (18.1.7) reopened the plugin-root filter for ~/.omp/plugins marketplace installs,
# but extensibility/skills.ts still drops every user-level `claude-plugins` skill
# (ponytail, superwhisper, reviewable-html-workbench) unless the source is opted
# in. `claude` also covers `claude-plugins` and ~/.claude/skills (context-search).
enabledProviders:
  - claude
retry: 
  fallbackChains: 
    anthropic/*: 
      - openai-codex/gpt-6-astra
      - openai-codex/gpt-5.6-sol
    openai-codex/*: 
      - anthropic/claude-sonnet-5
      - anthropic/claude-haiku-4-5
  usageAwareFallback: true
  usageReservePct: 20
  usageReservePolicy: auto
  modelFallback: true
  maxRetries: 4
  maxDelayMs: 60000
symbolPreset: unicode
defaultThinkingLevel: auto
magicKeywords: 
  enabled: false
colorBlindMode: true
setupVersion: 2
dev: 
  autoqaConsent: granted
composer: 
  shape: pi
hideThinkingBlock: false
browser: 
  screenshotDir: .agent-msgs/screenshots