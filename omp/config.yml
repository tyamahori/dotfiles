# slow (reviewer overrides) and advisor stay on Codex: cross-family review
# and second opinions for Claude-authored work.
modelRoles:
  vision: anthropic/claude-sonnet-5-5
  smol: anthropic/claude-haiku-4-5
  task: anthropic/claude-sonnet-5-5
  commit: anthropic/claude-haiku-4-5
  plan: anthropic/claude-fable-5-1
  slow: openai-codex/gpt-6-astra
  advisor: openai-codex/gpt-5.6-terra
  default: anthropic/claude-opus-5-5
  web: web/google
  tiny: local/lfm2.5-350m
retry:
  fallbackChains:
    openai-codex/gpt-6-astra:
      - openai-codex/gpt-6.1-sol
    anthropic/*:
      - openai-codex/gpt-6-astra
      - openai-codex/gpt-6.1-sol
    openai-codex/*:
      - anthropic/claude-sonnet-5
      - anthropic/claude-haiku-4-5
    web:
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-6-luna
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/mojeek
      - web/public
      - web/perplexity
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-6.1-sol
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
  usageAwareFallback: true
  usageReservePct: 20
  usageReservePolicy: auto
  modelFallback: true
  maxRetries: 4
  maxDelayMs: 60000
task:
  showResolvedModelBadge: true
  maxRecursionDepth: 1
  softRequestBudget: 60
  agentModelOverrides:
    scout: "@smol"
    reviewer: "@slow"
    security-reviewer: "@slow"
    librarian: "@smol"
compaction:
  thresholdTokens: 160000
  # snapcompact omitted: with the fixed 160k trigger it kept ~88% of tokens
  # (median, 185 runs) and re-fired within minutes; LLM methods halve context.
  methodOrder: [remote, handoff, shake, soft]
lsp:
  diagnosticsOnEdit: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  collapseCompacted: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: false
skills:
  ignoredSkills:
    - php-code-review
    - php-project-guide
    - upgrade-php
    - freee-api-skill
    - mcp-builder
    # Namespaced duplicates from the claude/codex providers. codex/terminal-browser
    # is the Codex flavor (escalated-permission advice wrong for OMP); the bare
    # default flavor stays. claude/plannotator duplicates ~/.agents/skills.
    - codex/terminal-browser
    - claude/plannotator
enabledProviders:
  - claude
  - codex
defaultThinkingLevel: medium
magicKeywords:
  enabled: false
colorBlindMode: true
setupVersion: 2
dev:
  autoqaConsent: granted
composer:
  shape: pi
browser:
  screenshotDir: .agent-msgs/screenshots